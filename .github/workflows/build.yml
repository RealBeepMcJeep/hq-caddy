# Probe upstream versions every 6 hours; build, self-test and publish the image
# only when something changed. The repo is pushed here by a one-way Gitea push
# mirror, so this workflow never writes to the repository.
#
# "Changed" = the hash of scripts/probe-versions.sh output plus every tracked
# build input (Dockerfile, rootfs/, .dockerignore, the probe script and this
# workflow) differs from the fingerprint label on :latest.
#
# Tags: :latest, :YYYYMMDD-HHMMSS and :sha-<commit>. Roll back with dated tags.
# Images are multi-arch (linux/amd64, linux/arm64). Nothing is pushed unless the
# self-test passes; pushes to other branches build and test but never publish.
name: Build image

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: write # re-enable this workflow so the schedule never lapses

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      image: ${{ steps.decide.outputs.image }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repository
      # activity; re-enabling through the API resets that without a commit.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"

      - name: Probe upstream versions
        run: bash scripts/probe-versions.sh | tee versions.env

      - name: Compare with the published image
        id: decide
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          fingerprint="$( { cat versions.env; git ls-files -s Dockerfile rootfs .dockerignore \
            scripts/probe-versions.sh .github/workflows/build.yml; } | sha256sum | cut -d' ' -f1)"
          labels="$(skopeo inspect --creds "${{ github.actor }}:${{ github.token }}" \
            --format '{{json .Labels}}' "docker://$image:latest" 2>/dev/null || echo '{}')"
          published="$(jq -r '."io.hq-caddy.fingerprint" // ""' <<< "$labels")"
          jq -r '."io.hq-caddy.inputs" // ""' <<< "$labels" | tr ' ' '\n' | sed '/^$/d' > published.env

          build=true
          publish=true
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            publish=false # branch/PR validation: always build and test, never publish
          elif [ "$published" = "$fingerprint" ] && [ "$FORCE" != true ]; then
            build=false
          fi
          {
            echo "image=$image"
            echo "fingerprint=$fingerprint"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            if [ "$publish" = false ]; then echo "### Branch build: test only, nothing will be published"
            elif [ "$build" = true ]; then echo "### Building a new image"
            else echo "### Up to date: nothing to build"; fi
            echo '```diff'
            diff -u published.env versions.env | tail -n +3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: versions
          path: versions.env

  build:
    needs: probe
    if: needs.probe.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ${{ needs.probe.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: versions

      - name: Build arguments
        id: args
        run: |
          {
            echo 'list<<EOF'
            cat versions.env
            echo "BUILD_INPUTS=$(tr '\n' ' ' < versions.env)"
            echo EOF
            echo "inputs=$(tr '\n' ' ' < versions.env)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=sha,format=short,prefix=sha-
          labels: |
            io.hq-caddy.fingerprint=${{ needs.probe.outputs.fingerprint }}
            io.hq-caddy.inputs=${{ steps.args.outputs.inputs }}

      # amd64 into the local engine first, for the self-test.
      - name: Build (amd64, for the self-test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # The generator end to end: a local git repo as the config source, an upstream,
      # a TCP forward, a rejected commit (named file, old config keeps serving), a fix,
      # status checks, and a clean stop. Certificates come from Caddy's local CA.
      - name: Self-test
        run: |
          # shellcheck disable=SC2016,SC2154  # wait_for evaluates its quoted condition; rc is set in the trap
          set -Eeuo pipefail
          annotate() { local text; text="$(cat)"; text="${text//'%'/'%25'}"; echo "::error title=$1::${text//$'\n'/'%0A'}"; }
          trap 'rc=$?; trap - ERR; { echo "command: $BASH_COMMAND (exit $rc)"; docker exec hq hq-caddy status || true; docker logs hq 2>&1 | tail -n 30; } 2>&1 | annotate self-test' ERR
          T=/tmp/selftest; mkdir -p "$T/up" "$T/data"; echo upstream-ok > "$T/up/marker.txt"
          (cd "$T/up" && nohup python3 -m http.server 18999 --bind 127.0.0.1 > /dev/null 2>&1 &)
          git init -q --bare -b main "$T/config.git"; git clone -q "$T/config.git" "$T/work"
          commit() { git -C "$T/work" add -A; git -C "$T/work" -c user.name=ci -c user.email=ci@example.com commit -qm "$1"; git -C "$T/work" push -q origin main; }
          mkdir -p "$T/work/sites" "$T/work/tcp"
          printf '# check: /marker.txt\nimport proxy upstream 127.0.0.1:18999\n' > "$T/work/sites/upstream.caddy"
          printf 'import proxy hello.demo 127.0.0.1:18999\n' > "$T/work/sites/hello.demo.caddy"
          printf '# check: tcp\nimport forward 18022 127.0.0.1:18999\n' > "$T/work/tcp/echo.caddy"
          commit "first sites"
          docker run --rm "$IMAGE:latest" --version
          docker run -d --name hq --network host --user "$(id -u):$(id -g)" -e HOME=/data \
            -e PROXY_DOMAIN=example.test -e HQ_TLS=internal -e PROXY_BIND=127.0.0.1 \
            -e PROXY_HTTP_PORT=18080 -e PROXY_HTTPS_PORT=18443 -e HQ_POLL_SECONDS=3 \
            -e HQ_CONFIG_REPO=file:///config.git -v "$T/config.git:/config.git" -v "$T/data:/data" "$IMAGE:latest"
          get() { curl -sk -o /dev/null -w '%{http_code}' --resolve "$1.example.test:18443:127.0.0.1" "https://$1.example.test:18443$2"; }
          wait_for() { for _ in $(seq 1 40); do eval "$1" && return 0; sleep 1; done; echo "timed out: $1"; return 1; }
          # Capture first, then grep: `cmd | grep -q` fails under pipefail when grep
          # exits at the first match while cmd is still writing (SIGPIPE).
          status_has() { local out; out="$(docker exec hq hq-caddy status 2>&1 || true)"; grep -q "$1" <<< "$out"; }
          page_has() { local out; out="$(curl -sk --resolve sites.example.test:18443:127.0.0.1 https://sites.example.test:18443/ || true)"; grep -q "$1" <<< "$out"; }
          wait_for '[ "$(get upstream /marker.txt)" = 200 ]'
          [ "$(get sites /)" = 200 ]
          [ "$(get hello.demo /marker.txt)" = 200 ]
          [ "$(get nothing.demo /)" = 404 ]
          [ "$(get no-such-site /)" = 404 ]
          [ "$(curl -s -m 5 http://127.0.0.1:18022/marker.txt)" = upstream-ok ]
          status_has 'applied: .* first sites'
          # A broken commit is rejected with the file named; the old config keeps serving.
          printf 'import site bad {\n\treverse_proxy 127.0.0.1:1\n' > "$T/work/sites/bad.caddy"; commit "broken site"
          wait_for 'status_has "REJECTED: .*sites/bad.caddy: unbalanced braces"'
          [ "$(get upstream /marker.txt)" = 200 ]
          page_has 'was rejected'
          # The fix applies and clears the banner.
          rm "$T/work/sites/bad.caddy"; printf 'import proxy second 127.0.0.1:18999\n' > "$T/work/sites/second.caddy"; commit "fix"
          wait_for '[ "$(get second /marker.txt)" = 200 ]'
          if page_has 'was rejected'; then
            echo "the rejection banner is still shown after the fix"; false
          fi
          # Status checks (the first round runs 15 s after start).
          wait_for 'curl -sk --resolve sites.example.test:18443:127.0.0.1 https://sites.example.test:18443/status.json | jq -e ".checks[\"site:upstream\"].state == \"up\" and .checks[\"tcp:echo\"].state == \"up\"" > /dev/null'
          docker exec hq hq-caddy checks
          start=$SECONDS; docker stop -t 30 hq > /dev/null
          [ "$(docker inspect -f '{{.State.ExitCode}}' hq)" = 0 ] && [ $((SECONDS - start)) -lt 25 ]
          echo "self-test passed"

      # Every platform: the arm64 build runs the module check under emulation.
      # Pushes only from main (publish), after the self-test above.
      - name: Build all platforms${{ needs.probe.outputs.publish == 'true' && ' and publish' || '' }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.probe.outputs.publish == 'true' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Summary
        if: needs.probe.outputs.publish == 'true'
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
            echo '```'
            cat versions.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
