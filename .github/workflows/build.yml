# Probe upstream versions every 6 hours; build, self-test and publish the image
# only when something changed. The repo is pushed here by a one-way Gitea push
# mirror, so this workflow never writes to the repository.
#
# "Changed" = the hash of scripts/probe-versions.sh output plus every tracked
# build input (Dockerfile, rootfs/, .dockerignore, the probe script and this
# workflow) differs from the fingerprint label on :latest.
#
# Tags: :latest, :YYYYMMDD-HHMMSS and :sha-<commit>. Roll back with dated tags.
# Images are multi-arch (linux/amd64, linux/arm64). Nothing is pushed unless the
# self-test passes; pushes to other branches build and test but never publish.
name: Build image

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: write # re-enable this workflow so the schedule never lapses

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      image: ${{ steps.decide.outputs.image }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repository
      # activity; re-enabling through the API resets that without a commit.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"

      - name: Probe upstream versions
        run: bash scripts/probe-versions.sh | tee versions.env

      - name: Compare with the published image
        id: decide
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          fingerprint="$( { cat versions.env; git ls-files -s Dockerfile rootfs .dockerignore \
            scripts/probe-versions.sh .github/workflows/build.yml; } | sha256sum | cut -d' ' -f1)"
          labels="$(skopeo inspect --creds "${{ github.actor }}:${{ github.token }}" \
            --format '{{json .Labels}}' "docker://$image:latest" 2>/dev/null || echo '{}')"
          published="$(jq -r '."io.hq-caddy.fingerprint" // ""' <<< "$labels")"
          jq -r '."io.hq-caddy.inputs" // ""' <<< "$labels" | tr ' ' '\n' | sed '/^$/d' > published.env

          build=true
          publish=true
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            publish=false # branch/PR validation: always build and test, never publish
          elif [ "$published" = "$fingerprint" ] && [ "$FORCE" != true ]; then
            build=false
          fi
          {
            echo "image=$image"
            echo "fingerprint=$fingerprint"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            if [ "$publish" = false ]; then echo "### Branch build: test only, nothing will be published"
            elif [ "$build" = true ]; then echo "### Building a new image"
            else echo "### Up to date: nothing to build"; fi
            echo '```diff'
            diff -u published.env versions.env | tail -n +3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: versions
          path: versions.env

  build:
    needs: probe
    if: needs.probe.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ${{ needs.probe.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: versions

      - name: Build arguments
        id: args
        run: |
          {
            echo 'list<<EOF'
            cat versions.env
            echo "BUILD_INPUTS=$(tr '\n' ' ' < versions.env)"
            echo EOF
            echo "inputs=$(tr '\n' ' ' < versions.env)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=sha,format=short,prefix=sha-
          labels: |
            io.hq-caddy.fingerprint=${{ needs.probe.outputs.fingerprint }}
            io.hq-caddy.inputs=${{ steps.args.outputs.inputs }}

      # amd64 into the local engine first, for the self-test.
      - name: Build (amd64, for the self-test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # The generator end to end: a local git repo as the config source, an upstream,
      # a TCP forward, a rejected commit (named file, old config keeps serving), a fix,
      # dns/records against a stand-in Cloudflare API, status checks, and a clean stop.
      # Certificates come from Caddy's local CA.
      - name: Self-test
        run: |
          # shellcheck disable=SC2016,SC2154  # wait_for evaluates its quoted condition; rc is set in the trap
          set -Eeuo pipefail
          annotate() { local text; text="$(cat)"; text="${text//'%'/'%25'}"; echo "::error title=$1::${text//$'\n'/'%0A'}"; }
          trap 'rc=$?; trap - ERR; { echo "command: $BASH_COMMAND (exit $rc)"; docker exec hq hq-caddy status || true; docker logs hq 2>&1 | tail -n 30; } 2>&1 | annotate self-test' ERR
          T=/tmp/selftest; mkdir -p "$T/up" "$T/data"; echo upstream-ok > "$T/up/marker.txt"
          (cd "$T/up" && nohup python3 -m http.server 18999 --bind 127.0.0.1 > /dev/null 2>&1 &)
          # A stand-in relay: answers with the port header it received ("files" without one).
          cat > "$T/relay.py" <<'EOF'
          import http.server
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  port, root = self.headers.get("X-Hq-Relay-Port"), self.headers.get("X-Hq-Relay-Root")
                  body = (port or (f"root:{root}" if root else "files")).encode()
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(("127.0.0.1", 18997), Handler).serve_forever()
          EOF
          nohup python3 "$T/relay.py" > /dev/null 2>&1 &
          # A stand-in Cloudflare API (zone example.test), seeded with records hq-caddy must not
          # change: the wildcard, someone else's record, and a hand-made vpn record to adopt.
          cat > "$T/fake_cf.py" <<'EOF'
          import http.server, json, re, sys, urllib.parse, itertools
          ids = itertools.count(100)
          RECORDS = json.load(open(sys.argv[2]))
          class H(http.server.BaseHTTPRequestHandler):
              def reply(self, body, code=200):
                  data = json.dumps(body).encode(); self.send_response(code); self.send_header("Content-Type", "application/json"); self.end_headers(); self.wfile.write(data)
              def body(self):
                  return json.loads(self.rfile.read(int(self.headers.get("Content-Length", 0))) or b"{}")
              def do_GET(self):
                  u = urllib.parse.urlparse(self.path); q = urllib.parse.parse_qs(u.query)
                  if u.path == "/zones":
                      return self.reply({"success": True, "result": [{"id": "z1"}] if q.get("name") == [sys.argv[3]] else []})
                  if u.path == "/zones/z1/dns_records":
                      rs = [r for r in RECORDS if "name" not in q or r["name"] == q["name"][0]]
                      return self.reply({"success": True, "result": rs, "result_info": {"total_pages": 1}})
                  if u.path == "/dump":
                      return self.reply(RECORDS)
                  self.reply({"success": False}, 404)
              def do_POST(self):
                  b = self.body(); b["id"] = f"r{next(ids)}"
                  if len(b.get("comment", "")) > 100:
                      return self.reply({"success": False, "errors": [{"message": "comment too long"}]}, 400)
                  RECORDS.append(b); self.reply({"success": True, "result": b})
              def do_PATCH(self):
                  rid = self.path.rsplit("/", 1)[1]; b = self.body()
                  for r in RECORDS:
                      if r["id"] == rid: r.update(b); return self.reply({"success": True, "result": r})
                  self.reply({"success": False, "errors": [{"message": "no such record"}]}, 404)
              def do_DELETE(self):
                  rid = self.path.rsplit("/", 1)[1]
                  RECORDS[:] = [r for r in RECORDS if r["id"] != rid]; self.reply({"success": True, "result": {"id": rid}})
              def log_message(self, *a): pass
          http.server.HTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          EOF
          cat > "$T/zone.json" <<'EOF'
          [{"id": "w1", "type": "A", "name": "*.example.test", "content": "127.0.0.1", "proxied": false, "comment": ""},
           {"id": "x1", "type": "A", "name": "other.example.test", "content": "192.0.2.99", "proxied": false, "comment": "someone else's"},
           {"id": "v1", "type": "A", "name": "vpn.example.test", "content": "203.0.113.39", "proxied": false, "comment": "by hand"}]
          EOF
          nohup python3 "$T/fake_cf.py" 18995 "$T/zone.json" example.test > /dev/null 2>&1 &
          git init -q --bare -b main "$T/config.git"; git clone -q "$T/config.git" "$T/work"
          commit() { git -C "$T/work" add -A; git -C "$T/work" -c user.name=ci -c user.email=ci@example.com commit -qm "$1"; git -C "$T/work" push -q origin main; }
          mkdir -p "$T/work/sites" "$T/work/tcp"
          printf '# check: /marker.txt\nimport proxy upstream 127.0.0.1:18999\n' > "$T/work/sites/upstream.caddy"
          printf 'import proxy hello.demo 127.0.0.1:18999\n' > "$T/work/sites/hello.demo.caddy"
          printf '# check: tcp\nimport forward 18022 127.0.0.1:18999\n' > "$T/work/tcp/echo.caddy"
          printf 'import relay relayed 8788\n' > "$T/work/sites/relayed.caddy"
          printf 'import relay_files static1\n' > "$T/work/sites/static1.caddy"
          printf 'import site rooted {\n\t@hidden path *.mjs\n\trespond @hidden 404\n\timport relay_root /workspace/demo/files\n}\n' > "$T/work/sites/rooted.caddy"
          printf 'import site custom {\n\trespond /internal/* 404\n\timport relay_upstream 31143\n}\n' > "$T/work/sites/custom.caddy"
          commit "first sites"
          docker run --rm "$IMAGE:latest" --version
          docker run -d --name hq --network host --user "$(id -u):$(id -g)" -e HOME=/data \
            -e PROXY_DOMAIN=example.test -e HQ_TLS=internal -e PROXY_BIND=127.0.0.1 \
            -e PROXY_HTTP_PORT=18080 -e PROXY_HTTPS_PORT=18443 -e HQ_POLL_SECONDS=3 -e HQ_RELAY=127.0.0.1:18997 \
            -e HQ_DNS_RECORDS=true -e CLOUDFLARE_API_TOKEN=ci-dummy -e HQ_CLOUDFLARE_API=http://127.0.0.1:18995 \
            -e HQ_CONFIG_REPO=file:///config.git -v "$T/config.git:/config.git" -v "$T/data:/data" "$IMAGE:latest"
          get() { curl -sk -o /dev/null -w '%{http_code}' --resolve "$1.example.test:18443:127.0.0.1" "https://$1.example.test:18443$2"; }
          wait_for() { for _ in $(seq 1 40); do eval "$1" && return 0; sleep 1; done; echo "timed out: $1"; return 1; }
          # Capture first, then grep: `cmd | grep -q` fails under pipefail when grep
          # exits at the first match while cmd is still writing (SIGPIPE).
          status_has() { local out; out="$(docker exec hq hq-caddy status 2>&1 || true)"; grep -q "$1" <<< "$out"; }
          page_has() { local out; out="$(curl -sk --resolve sites.example.test:18443:127.0.0.1 https://sites.example.test:18443/ || true)"; grep -q "$1" <<< "$out"; }
          wait_for '[ "$(get upstream /marker.txt)" = 200 ]'
          [ "$(get sites /)" = 200 ]
          [ "$(get hello.demo /marker.txt)" = 200 ]
          [ "$(get nothing.demo /)" = 404 ]
          [ "$(get no-such-site /)" = 404 ]
          [ "$(curl -s -m 5 http://127.0.0.1:18022/marker.txt)" = upstream-ok ]
          # Relay: the port travels in the header; relay_files strips even a forged one.
          body() { curl -sk --resolve "$1.example.test:18443:127.0.0.1" "https://$1.example.test:18443$2" "${@:3}"; }
          [ "$(body relayed /)" = 8788 ]
          [ "$(body custom /x)" = 31143 ]
          [ "$(get custom /internal/a)" = 404 ]
          [ "$(body static1 / -H 'X-Hq-Relay-Port: 22')" = files ]
          # Clients can't inject either relay header; relay_root sends its folder.
          [ "$(body static1 / -H 'X-Hq-Relay-Root: /workspace/secret')" = files ]
          [ "$(body relayed / -H 'X-Hq-Relay-Root: /workspace/secret')" = 8788 ]
          [ "$(body rooted /x.html -H 'X-Hq-Relay-Port: 22')" = root:/workspace/demo/files ]
          [ "$(get rooted /app.mjs)" = 404 ]
          status_has 'applied: .* first sites'
          # A broken commit is rejected with the file named; the old config keeps serving.
          printf 'import site bad {\n\treverse_proxy 127.0.0.1:1\n' > "$T/work/sites/bad.caddy"; commit "broken site"
          wait_for 'status_has "REJECTED: .*sites/bad.caddy: unbalanced braces"'
          [ "$(get upstream /marker.txt)" = 200 ]
          page_has 'was rejected'
          # The fix applies and clears the banner.
          rm "$T/work/sites/bad.caddy"; printf 'import proxy second 127.0.0.1:18999\n' > "$T/work/sites/second.caddy"; commit "fix"
          wait_for '[ "$(get second /marker.txt)" = 200 ]'
          if page_has 'was rejected'; then
            echo "the rejection banner is still shown after the fix"; false
          fi
          # dns/records: create and adopt; never touch other records.
          zone() { curl -s http://127.0.0.1:18995/dump | jq -r '.[] | "\(.type) \(.name) \(.content) \(.comment)"' | sort; }
          zone_has() { local out; out="$(zone)"; grep -qx "$1" <<< "$out"; }
          mkdir -p "$T/work/dns"
          printf 'vpn  A  203.0.113.39  # VPN\nnew  A  192.0.2.60\n' > "$T/work/dns/records"; commit "dns records"
          wait_for 'zone_has "A new.example.test 192.0.2.60 hq-caddy records"'
          zone_has 'A vpn.example.test 203.0.113.39 hq-caddy records: VPN'
          zone_has "A other.example.test 192.0.2.99 someone else's"
          zone_has 'A \*.example.test 127.0.0.1 '
          docker exec hq hq-caddy dns
          # An invalid records file rejects the commit (file and line named); the zone stays.
          printf 'vpn  A  203.0.113.39  # VPN\nnew  MX  mail\n' > "$T/work/dns/records"; commit "bad dns"
          wait_for 'status_has "REJECTED: .*dns/records: line 2: type MX not supported"'
          zone_has 'A new.example.test 192.0.2.60 hq-caddy records'
          # A record taken out of the file is deleted, since hq-caddy made it; the others remain.
          printf 'vpn  A  203.0.113.39  # VPN\n' > "$T/work/dns/records"; commit "drop new"
          wait_for '! zone_has "A new.example.test 192.0.2.60 hq-caddy records"'
          zone_has "A other.example.test 192.0.2.99 someone else's"
          zone_has 'A vpn.example.test 203.0.113.39 hq-caddy records: VPN'
          [ "$(zone | wc -l)" = 3 ]
          # Status checks (the first round runs 15 s after start).
          wait_for 'curl -sk --resolve sites.example.test:18443:127.0.0.1 https://sites.example.test:18443/status.json | jq -e ".checks[\"site:upstream\"].state == \"up\" and .checks[\"tcp:echo\"].state == \"up\"" > /dev/null'
          docker exec hq hq-caddy checks
          start=$SECONDS; docker stop -t 30 hq > /dev/null
          [ "$(docker inspect -f '{{.State.ExitCode}}' hq)" = 0 ] && [ $((SECONDS - start)) -lt 25 ]
          echo "self-test passed"

      # Every platform: the arm64 build runs the module check under emulation.
      # Pushes only from main (publish), after the self-test above.
      - name: Build all platforms${{ needs.probe.outputs.publish == 'true' && ' and publish' || '' }}
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.probe.outputs.publish == 'true' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Summary
        if: needs.probe.outputs.publish == 'true'
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
            echo '```'
            cat versions.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
